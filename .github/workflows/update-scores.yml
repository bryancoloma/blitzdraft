name: Update Scores

on:
  workflow_dispatch:      # lets you run it manually with a button
  schedule:
    # times are UTC. Runs every 15 min during game windows only.
    - cron: '*/15 0-4 * * 5'      # Thu 5pm-9pm PT (Fri 0-4 UTC)
    - cron: '*/15 17-23 * * 0'    # Sun 10am-4pm PT
    - cron: '*/15 0-4 * * 1'      # Sun late + Sun night (Mon 0-4 UTC)
    - cron: '*/15 0-4 * * 2'      # Mon 5pm-9pm PT (Tue 0-4 UTC)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Pull games and score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python pull_games.py
          python score_week.py