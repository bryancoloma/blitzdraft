name: Update Scores

on:
  workflow_dispatch:      # lets you run it manually with a button
  schedule:
    # every 15 min, daily, covering all possible game hours (UTC)
    # 17:00-23:59 UTC = 10am-4:59pm PT (day games)
    - cron: '*/15 17-23 * * *'
    # 00:00-07:00 UTC = 5pm-midnight PT (night games, spills to next UTC day)
    - cron: '*/15 0-7 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Pull games and score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python pull_games.py
          python score_week.py