<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blitzDraft</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>blitzDraft</h1>

    <p id="greeting"></p>

<div id="nameBox">
  <input type="text" id="displayNameInput" placeholder="Display Name">
  <input type="text" id="actualNameInput" placeholder="Actual Name (for payouts)">
  <button id="saveNameBtn">Save Name</button>
</div>

    <nav>
        <a href="index.html">Picks</a> |
        <a href="group.html">Group Picks</a> |
        <a href="season.html">Season</a>
    </nav>  

    <div id="games">
        <!-- Games will be loaded here -->
    </div>

    <div id="tiebreakers">
  <p><strong>Tiebreakers</strong></p>
  <label>Total points in the last game: <input type="number" id="tbGuess" min="0"></label>
  <br>
  <label>Team scoring the most points this week: 
    <select id="tbMostPoints">
      <option value="">Select a team</option>
    </select>
    </label>
    </div>      
    <button id="saveBtn">Save Picks</button>

<button id="logoutBtn">Log Out</button>
    
    
<!-- 1. Load the Supabase library FROM the web -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Load YOUR code (must come AFTER the library above) -->
<script src="app.js"></script>

</body>

</html>
